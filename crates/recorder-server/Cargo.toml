[package]
name = "recorder-server"
version = "0.1.0"
description = "Headless Lab recorder — schedules daily Webull captures in NY time and writes them via LabStorage"
edition = "2024"

[dependencies]
radar-core = { path = "../radar-core", features = ["client"] }
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.8"
tower-http = { version = "0.6", features = ["compression-gzip"] }

[dev-dependencies]
# ใช้เฉพาะ `ServiceExt::oneshot` ใน router tests (tower เป็น transitive dep ของ axum อยู่แล้ว)
tower = { version = "0.5", features = ["util"] }

[lints.clippy]
all = { level = "deny", priority = -1 }
