[package]
name = "recorder-server"
version = "0.1.0"
description = "Headless Lab recorder — schedules daily Webull captures in NY time and writes them via LabStorage"
edition = "2024"

[dependencies]
radar-core = { path = "../radar-core", features = ["client"] }
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.clippy]
all = { level = "deny", priority = -1 }
