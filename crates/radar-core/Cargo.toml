[package]
name = "radar-core"
version = "0.1.0"
description = "PREMIUM RADAR domain core — quant, screener, Webull conventions (framework-free)"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
libm = "0.2"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
hmac = "0.12"
sha1 = "0.10"
md-5 = "0.10"
base64 = "0.22"
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
rumqttc = { version = "0.24", optional = true }
tokio = { version = "1", features = ["rt", "time", "sync"], optional = true }

[features]
default = []
client = ["reqwest", "uuid"]
stream = ["rumqttc", "tokio"]

[dev-dependencies]
serde_json = "1"
wiremock = "0.6"
tokio = { version = "1", features = ["macros", "rt"] }

[lints.clippy]
all = { level = "deny", priority = -1 }

