[package]
name = "radar-core"
version = "0.1.0"
description = "PREMIUM RADAR domain core — quant, screener, Webull conventions (framework-free)"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
libm = "0.2"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
hmac = "0.12"
sha1 = "0.10"
md-5 = "0.10"
base64 = "0.22"

[lints.clippy]
all = { level = "deny", priority = -1 }

[dev-dependencies]
serde_json = "1"
