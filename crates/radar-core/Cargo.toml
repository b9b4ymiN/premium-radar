[package]
name = "radar-core"
version = "0.1.0"
description = "PREMIUM RADAR domain core — quant, screener, Webull conventions (framework-free)"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
libm = "0.2"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
hmac = "0.13"
sha1 = "0.11"
sha2 = "0.11"
md-5 = "0.11"
base64 = "0.23"
serde_json = "1"
prost = "0.14"
reqwest = { version = "0.13", features = ["blocking", "json", "query", "rustls"], optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
rumqttc = { version = "0.25", default-features = false, features = ["use-native-tls"], optional = true }
tokio = { version = "1", features = ["rt", "time", "sync"], optional = true }

[features]
default = []
client = ["reqwest", "uuid"]
stream = ["rumqttc", "tokio"]

[dev-dependencies]
serde_json = "1"
prost = "0.14"
wiremock = "0.6"
tokio = { version = "1", features = ["macros", "rt"] }

[lints.clippy]
all = { level = "deny", priority = -1 }

