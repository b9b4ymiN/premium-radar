[package]
name = "premium-radar"
version = "0.1.0"
description = "PREMIUM RADAR — CSP / Covered Call screener (Webull TH)"
authors = ["THP"]
edition = "2024"

[lib]
name = "premium_radar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libm = "0.2"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
hmac = "0.12"
sha1 = "0.10"
md-5 = "0.10"
base64 = "0.22"

[lints.clippy]
all = { level = "deny", priority = -1 }

# See the optimization guideline: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
