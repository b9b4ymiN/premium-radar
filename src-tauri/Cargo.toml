[package]
name = "premium-radar"
version = "0.2.1"
description = "PREMIUM RADAR — CSP / Covered Call screener (Webull TH)"
authors = ["THP"]
edition = "2024"

[lib]
name = "premium_radar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
keyring = { version = "3", features = ["windows-native", "apple-native"] }
radar-core = { path = "../crates/radar-core", features = ["client", "stream"] }

[lints.clippy]
all = { level = "deny", priority = -1 }
