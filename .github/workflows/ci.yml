name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Gates (check, build, fmt, clippy, test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # rust-toolchain.toml pins stable-x86_64-pc-windows-msvc for cargo runs
      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: npm ci

      - name: TypeScript + ESLint (npm run check)
        run: npm run check

      - name: Build frontend (npm run build)
        run: npm run build

      - name: Rust format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --workspace

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      # fails on known vulnerabilities (RustSec); "unmaintained" notices stay warnings
      - name: Rust dependency audit
        run: cargo audit

      - name: npm dependency audit
        run: npm audit --audit-level=high
