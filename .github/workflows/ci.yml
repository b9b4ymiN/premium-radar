name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  gates:
    name: Gates (check, build, fmt, clippy, test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # rust-toolchain.toml pins stable-x86_64-pc-windows-msvc for cargo runs
      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: TypeScript + ESLint (npm run check)
        run: npm run check

      - name: Build frontend (npm run build)
        run: npm run build

      - name: Rust format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --workspace
