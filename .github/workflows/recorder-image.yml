name: Recorder image

# Builds the recorder-server Docker image and pushes it to GHCR.
# Triggers only on recorder-v* tags, plus manual dispatch (build-only check —
# a dispatch has no tag, so `push` below stays false and nothing is published).
on:
  push:
    tags: ["recorder-v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR image names must be lowercase; the GitHub owner is not.
      - name: Lowercase image name
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}/premium-radar-recorder" >> "$GITHUB_OUTPUT"
        id: image

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.image.outputs.name }}
          tags: |
            # recorder-v1.2.3 -> v1.2.3
            type=match,pattern=recorder-(v.*),group=1
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/recorder-v') }}

      # amd64 only on purpose: the release profile (lto + codegen-units=1)
      # makes a QEMU-emulated arm64 Rust build extremely slow. Add
      # docker/setup-qemu-action@v3 and "linux/arm64" to platforms if an
      # arm64 host (e.g. RPi/Odroid homeserver) ever needs it.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ startsWith(github.ref, 'refs/tags/recorder-v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
